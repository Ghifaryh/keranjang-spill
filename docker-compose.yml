services:
  keranjangspill:
    image: ghcr.io/ghifaryh/keranjang-spill:latest
    container_name: keranjangspill
    restart: unless-stopped
    ports:
      - "4321:4321"
    volumes:
      - keranjang_data:/app/data
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - DATABASE_PATH=/app/data/keranjang.db
      - APP_URL=${APP_URL:-https://spill.gehu.me}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USER_ID=${TELEGRAM_ALLOWED_USER_ID:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID:-}
      - GOOGLE_SERVICE_ACCOUNT_KEY=${GOOGLE_SERVICE_ACCOUNT_KEY:-}
      - SYNC_SECRET=${SYNC_SECRET:-}
      - CREATOR_NAME=${CREATOR_NAME:-Spill by Inten}
      - CREATOR_BIO=${CREATOR_BIO:-Rekomendasi outfit, skincare & printilan lucu. Ketik nomor spill dari video TikTok/IG kamu di bawah.}
      - CREATOR_AVATAR=${CREATOR_AVATAR:-}
      - CREATOR_TIKTOK=${CREATOR_TIKTOK:-https://tiktok.com}
      - CREATOR_INSTAGRAM=${CREATOR_INSTAGRAM:-https://instagram.com}
    # Uncomment below for Portainer with caddy-docker-proxy:
    # networks:
    #   - caddy-proxy
    # labels:
    #   caddy: spill.gehu.me
    #   caddy.reverse_proxy: "{{upstreams 4321}}"
    #   caddy.tls: /etc/caddy/certs/gehu_origin.crt /etc/caddy/certs/gehu_origin.key

volumes:
  keranjang_data:

